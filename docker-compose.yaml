services:
  comfy-ui:
    build:
      context: /docker
      args:
          - IMAGE_VERSION
          - COMFYUI_VERSION
          - COMFYUI_MANAGER_VERSION
          - MIRROR_URL
    ports:
      - "${HTTP_PORT:-8188}:8188"
    volumes:
      - ./volumes/models:/comfyUI/models
      - ./volumes/custom-nodes:/comfyUI/custom_nodes
      - ./volumes/user:/comfyUI/user
      - ./volumes/output:/comfyUI/output
    deploy:
      resources:
        reservations:
          devices:
              - driver: nvidia
                count: all
                capabilities: [compute, utility]
